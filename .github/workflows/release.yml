name: Publish LUMEN

on:
  push:
    branches: [main]
    paths: [release.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lumen-public-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'leoyang1984/lumen-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the reviewed distribution commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate version, notes and runtime hashes
        run: node scripts/release/validate.mjs
      - name: Upload, verify and publish
        run: node scripts/release/publish.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
